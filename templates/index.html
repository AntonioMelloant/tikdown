<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidDrop — Baixar vídeos TikTok</title>
  <meta name="description" content="Baixe vídeos do TikTok sem marca d'água e em alta qualidade. Rápido, gratuito e sem complicação." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tiktok-mode">
 
  <!-- Particle canvas -->
  <canvas id="particles-canvas"></canvas>
 
  <!-- Animated dot grid -->
  <div class="grid-overlay" id="grid-overlay"></div>
 
  <!-- Ambient background orbs -->
  <div class="bg-orb orb-1" id="orb1"></div>
  <div class="bg-orb orb-2" id="orb2"></div>
  <div class="bg-orb orb-3" id="orb3"></div>
  <div class="bg-orb orb-4" id="orb4"></div>
 
  <div class="container">
 
    <!-- Logo -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⬇</span>
        <span class="logo-text">VidDrop</span>
      </div>
    </header>
 
    <!-- Main content -->
    <main class="main">
 
      <!-- Hero text -->
      <div class="hero">
        <h1 class="hero-title">Baixar do TikTok</h1>
        <p class="hero-subtitle">Cole o link e baixe em alta qualidade, sem marca d'água</p>
      </div>
 
      <!-- Input card -->
      <div class="input-card" id="input-card">
        <div class="input-wrapper">
          <span class="input-icon" id="input-icon">🎵</span>
          <input
            type="url"
            id="video-url"
            class="url-input"
            placeholder="https://www.tiktok.com/@user/video/..."
            autocomplete="off"
            spellcheck="false"
            aria-label="URL do vídeo"
          />
          <button class="clear-btn" id="clear-btn" onclick="clearInput()" aria-label="Limpar input" style="display:none">✕</button>
        </div>
        <button class="download-btn" id="download-btn" onclick="handleDownload()">
          <span class="btn-icon">⬇</span>
          <span class="btn-text">Baixar</span>
          <span class="btn-shimmer"></span>
        </button>
      </div>
 
      <!-- Loading state -->
      <div class="loading-state" id="loading-state" style="display:none">
        <div class="spinner-ring" id="spinner-ring">
          <div></div><div></div><div></div><div></div>
        </div>
        <p class="loading-text">Buscando o vídeo...</p>
      </div>
 
      <!-- Result panel -->
      <div class="result-panel" id="result-panel" style="display:none">
        <div class="result-header">
          <div class="result-thumb-wrap">
            <div class="result-thumb" id="result-thumb">
              <span class="thumb-placeholder" id="thumb-placeholder">🎬</span>
            </div>
            <div class="play-badge" id="play-badge">▶</div>
          </div>
          <div class="result-meta">
            <p class="result-platform" id="result-platform">TikTok</p>
            <p class="result-title" id="result-title">Vídeo encontrado</p>
            <p class="result-author" id="result-author">@username</p>
          </div>
        </div>
        <div class="result-options" id="result-options">
          <!-- dynamically filled -->
        </div>
        <button class="try-another-btn" onclick="resetState()">⟵ Tentar outro link</button>
      </div>
 
      <!-- Error state -->
      <div class="error-state" id="error-state" style="display:none">
        <span class="error-icon">⚠</span>
        <p class="error-msg" id="error-msg">Link inválido. Verifique a URL e tente novamente.</p>
        <button class="try-another-btn" onclick="resetState()">Tentar novamente</button>
      </div>
 
      <!-- Features strip -->
      <div class="features" id="features-strip">
        <div class="feature-item">
          <span class="feature-icon" id="feat-icon-1">✦</span>
          <span>Sem marca de água</span>
        </div>
        <div class="feature-divider"></div>
        <div class="feature-item">
          <span class="feature-icon" id="feat-icon-2">✦</span>
          <span>Alta qualidade</span>
        </div>
        <div class="feature-divider"></div>
        <div class="feature-item">
          <span class="feature-icon" id="feat-icon-3">✦</span>
          <span>100% grátis</span>
        </div>
      </div>
 
    </main>
 
    <footer class="footer">
      <p>VidDrop &copy; 2026 — Apenas para uso pessoal</p>
    </footer>
 
  </div>
 
  <script src="script.js"></script>
</body>
</html>
