<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikDown — Baixar Vídeo do TikTok</title>
  <meta name="description" content="Baixe vídeos do TikTok sem marca d'água, em alta qualidade. Rápido e gratuito." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0c0c0c;
      --surface:   #141414;
      --border:    #242424;
      --cyan:      #00d4ff;
      --cyan-glow: rgba(0, 212, 255, 0.18);
      --cyan-faint: rgba(0, 212, 255, 0.06);
      --white:     #f5f5f5;
      --muted:     #555;
      --placeholder: #333;
      --success:   #10b981;
      --error:     #f87171;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── AMBIENT GLOW ── */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(0, 212, 255, 0.055) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      padding: 28px 32px;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.2px;
    }

    .logo-name span {
      color: var(--cyan);
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 1;
    }

    .center {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── TITLE ── */
    h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -1px;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      font-weight: 400;
      margin-bottom: 40px;
    }

    /* ── INPUT CARD ── */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card:focus-within {
      border-color: rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 0 4px var(--cyan-faint), 0 0 40px rgba(0, 212, 255, 0.08);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      transition: border-color 0.25s;
    }

    .input-wrap:focus-within {
      border-color: var(--cyan);
    }

    .input-icon {
      color: var(--placeholder);
      font-size: 15px;
      flex-shrink: 0;
      transition: color 0.25s;
      user-select: none;
    }

    .input-wrap:focus-within .input-icon {
      color: var(--cyan);
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      padding: 15px 0;
      caret-color: var(--cyan);
    }

    .url-input::placeholder {
      color: var(--placeholder);
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--placeholder);
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      display: none;
      transition: color 0.2s;
    }

    .clear-btn:hover { color: var(--muted); }
    .clear-btn.visible { display: block; }

    /* ── DOWNLOAD BUTTON ── */
    .btn-download {
      width: 100%;
      background: var(--cyan);
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.3s;
    }

    .btn-download:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 212, 255, 0.3);
    }

    .btn-download:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── SPINNER ── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── RESULT PANEL ── */
    .result {
      width: 100%;
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      animation: rise 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .result.show { display: block; }

    .result-header {
      padding: 14px 18px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--cyan);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    .result-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .opt {
      background: var(--surface);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      font-family: 'Inter', sans-serif;
      text-align: left;
      width: 100%;
    }

    .opt:hover { background: #1c1c1c; }

    .opt-icon { font-size: 18px; }

    .opt-info { display: flex; flex-direction: column; gap: 1px; }

    .opt-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--white);
    }

    .opt-note {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .opt-badge {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--cyan);
      background: var(--cyan-faint);
      border: 1px solid rgba(0,212,255,0.2);
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    /* ── ERROR ── */
    .error-msg {
      font-size: 0.8rem;
      color: var(--error);
      text-align: center;
      display: none;
      margin-top: -4px;
    }

    .error-msg.show { display: block; }

    /* ── SUCCESS ── */
    .success-msg {
      font-size: 0.8rem;
      color: var(--success);
      text-align: center;
      display: none;
      margin-top: -4px;
    }

    .success-msg.show { display: block; }

    /* ── FOOTER ── */
    footer {
      padding: 20px 32px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .footer-text {
      font-size: 0.75rem;
      color: #2a2a2a;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      header { padding: 22px 20px; }
      .result-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#" class="logo">
      <div class="logo-mark">⬇</div>
      <span class="logo-name">Tik<span>Down</span></span>
    </a>
  </header>

  <!-- MAIN -->
  <main>
    <div class="center">

      <h1>Baixar Vídeo do TikTok</h1>
      <p class="sub">Cole o link e baixe em alta qualidade, sem marca d'água</p>

      <div class="card" id="card">
        <div class="input-wrap" id="inputWrap">
          <span class="input-icon">🔗</span>
          <input
            type="url"
            id="urlInput"
            class="url-input"
            placeholder="https://www.tiktok.com/@user/video/..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button class="clear-btn" id="clearBtn" aria-label="Limpar" onclick="clearInput()">×</button>
        </div>

        <p class="error-msg" id="errorMsg">⚠ Cole um link válido do TikTok.</p>
        <p class="success-msg" id="successMsg">✅ Pronto! Escolha a qualidade abaixo.</p>

        <button class="btn-download" id="btnDownload" onclick="handleDownload()">
          <div class="spinner" id="spinner"></div>
          <span id="btnLabel">Baixar</span>
        </button>
      </div>

      <!-- Result panel -->
      <div class="result" id="result">
        <div class="result-header">Escolha a qualidade</div>
        <div class="result-options">
          <button class="opt" onclick="startDownload('4K')">
            <span class="opt-icon">🎬</span>
            <span class="opt-info">
              <span class="opt-label">4K Ultra HD</span>
              <span class="opt-note">MP4 · Sem marca d'água</span>
            </span>
            <span class="opt-badge">Melhor</span>
          </button>
          <button class="opt" onclick="startDownload('1080p')">
            <span class="opt-icon">📺</span>
            <span class="opt-info">
              <span class="opt-label">1080p HD</span>
              <span class="opt-note">MP4 · Alta qualidade</span>
            </span>
          </button>
          <button class="opt" onclick="startDownload('720p')">
            <span class="opt-icon">🖥️</span>
            <span class="opt-info">
              <span class="opt-label">720p</span>
              <span class="opt-note">MP4 · Padrão</span>
            </span>
          </button>
          <button class="opt" onclick="startDownload('MP3')">
            <span class="opt-icon">🎵</span>
            <span class="opt-info">
              <span class="opt-label">Áudio</span>
              <span class="opt-note">MP3 · Só o som</span>
            </span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p class="footer-text">© 2026 TikDown — uso pessoal</p>
  </footer>

  <script>
    const urlInput   = document.getElementById('urlInput');
    const clearBtn   = document.getElementById('clearBtn');
    const btnDownload= document.getElementById('btnDownload');
    const btnLabel   = document.getElementById('btnLabel');
    const spinner    = document.getElementById('spinner');
    const result     = document.getElementById('result');
    const errorMsg   = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    let lastDownloadQuality = null;

    /* Show/hide clear button */
    urlInput.addEventListener('input', () => {
      clearBtn.classList.toggle('visible', urlInput.value.length > 0);
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      if (!urlInput.value) result.classList.remove('show');
    });

    /* Clear */
    function clearInput() {
      urlInput.value = '';
      clearBtn.classList.remove('visible');
      result.classList.remove('show');
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      urlInput.focus();
    }

    /* Validate */
    function isValid(url) {
      return url.includes('tiktok.com') || url.includes('vm.tiktok') || url.includes('vt.tiktok');
    }

    /* Auto-trigger on paste */
    urlInput.addEventListener('paste', () => {
      setTimeout(() => {
        if (isValid(urlInput.value.trim())) handleDownload();
      }, 80);
    });

    /* Enter key */
    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleDownload();
    });

    /* Main handler */
    async function handleDownload() {
      const url = urlInput.value.trim();
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
      result.classList.remove('show');

      if (!url || !isValid(url)) {
        errorMsg.classList.add('show');
        urlInput.focus();
        return;
      }

      /* Loading state */
      btnDownload.disabled = true;
      spinner.style.display = 'block';
      btnLabel.textContent = 'Processando...';

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, quality: '4K' })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao processar');
        }

        // Sucesso
        lastDownloadQuality = data.quality;
        spinner.style.display = 'none';
        btnLabel.textContent = 'Baixar';
        btnDownload.disabled = false;
        successMsg.classList.add('show');
        result.classList.add('show');
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      } catch (err) {
        errorMsg.textContent = `⚠ ${err.message}`;
        errorMsg.classList.add('show');
        spinner.style.display = 'none';
        btnLabel.textContent = 'Baixar';
        btnDownload.disabled = false;
      }
    }

    /* Quality pick */
    async function startDownload(quality) {
      const url = urlInput.value.trim();
      
      btnDownload.disabled = true;
      spinner.style.display = 'block';
      btnLabel.textContent = `Baixando ${quality}...`;

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, quality })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro ao baixar');
        }

        // Iniciar download
        const downloadLink = document.createElement('a');
        downloadLink.href = `/api/get-file/${data.filename}`;
        downloadLink.download = data.filename;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        spinner.style.display = 'none';
        btnLabel.textContent = 'Baixar';
        btnDownload.disabled = false;

      } catch (err) {
        errorMsg.textContent = `⚠ ${err.message}`;
        errorMsg.classList.add('show');
        spinner.style.display = 'none';
        btnLabel.textContent = 'Baixar';
        btnDownload.disabled = false;
      }
    }
  </script>

</body>
</html>
